name: iOS Build (EAS Local)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - preview
          - production

jobs:
  build:
    name: Build iOS on macOS
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install global CLI tools
        run: |
          npm install -g @react-native-community/bob eas-cli
          echo "$(npm config get prefix)/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run EAS Build locally
        run: |
          eas build --platform ios --profile ${{ github.event.inputs.profile }} --local --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_ID: ${{ secrets.APPLE_ID }}
          EXPO_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          EXPO_DISTRIBUTION: internal

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tomato-ios-${{ github.event.inputs.profile }}
          path: |
            *.ipa
            build/**/*.ipa
          retention-days: 30