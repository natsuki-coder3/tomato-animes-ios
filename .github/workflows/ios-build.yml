name: iOS Build (EAS Local)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - preview
          - production

jobs:
  build:
    name: Build iOS on macOS
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Configure EAS credentials (local)
        run: |
          mkdir -p ~/.eas
          # Only include teamId if it's set and not "auto"
          if [ "${{ secrets.APPLE_TEAM_ID }}" != "auto" ] && [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
            TEAM_ID_LINE='"teamId": "${{ secrets.APPLE_TEAM_ID }}",'
          else
            TEAM_ID_LINE=""
          fi
          cat > ~/.eas/credentials.json << EOF
          {
            "ios": {
              "development": {
                "appleId": "${{ secrets.APPLE_ID }}",
                "applePassword": "${{ secrets.APPLE_PASSWORD }}",
                $TEAM_ID_LINE
                "distribution": "internal"
              }
            }
          }
          EOF
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Run EAS Build locally
        run: |
          eas build --platform ios --profile ${{ github.event.inputs.profile }} --local --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tomato-ios-${{ github.event.inputs.profile }}
          path: |
            *.ipa
            build/**/*.ipa
          retention-days: 30