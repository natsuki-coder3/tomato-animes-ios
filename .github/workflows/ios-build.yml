name: iOS Build (EAS Local)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - preview
          - production

jobs:
  build:
    name: Build iOS on macOS (Local)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install global CLI tools
        run: |
          npm install -g @react-native-community/bob eas-cli
          echo "$(npm config get prefix)/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install expect for automation
        run: brew install expect

      - name: Configure EAS Credentials locally (macOS runner)
        run: |
          # Create expect script to automate credentials setup on macOS
          cat > /tmp/setup_credentials.exp << 'EXPECT_EOF'
          spawn eas credentials:configure-build --platform ios --profile development
          expect "Do you want to log in to your Apple account?"
          send "y\r"
          expect "Apple ID:"
          send "$env(APPLE_ID)\r"
          expect "Password:"
          send "$env(APPLE_PASSWORD)\r"
          expect "Team:"
          send "\r"
          expect "Distribution:"
          send "internal\r"
          expect eof
          EXPECT_EOF

          APPLE_ID="${{ secrets.APPLE_ID }}" APPLE_PASSWORD="${{ secrets.APPLE_PASSWORD }}" expect /tmp/setup_credentials.exp
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}

      - name: Run EAS Build locally
        run: |
          eas build --platform ios --profile ${{ github.event.inputs.profile }} --local --non-interactive --freeze-credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tomato-ios-${{ github.event.inputs.profile }}
          path: |
            *.ipa
            build/**/*.ipa
          retention-days: 30