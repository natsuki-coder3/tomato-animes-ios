name: Setup iOS Credentials (Run Once)

on:
  workflow_dispatch:

jobs:
  setup-credentials:
    name: Configure EAS Credentials on macOS
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Configure EAS Credentials (Interactive via expect)
        run: |
          # Install expect for automation
          brew install expect

          # Create expect script to automate credentials setup
          cat > /tmp/setup_credentials.exp << 'EXPECT_EOF'
          spawn eas credentials:configure-build --platform ios --profile development
          expect "Do you want to log in to your Apple account?"
          send "y\r"
          expect "Apple ID:"
          send "$env(APPLE_ID)\r"
          expect "Password:"
          send "$env(APPLE_PASSWORD)\r"

          # Wait for either success or failure
          expect {
            "Invalid username and password combination" {
              puts "\n❌ ERRO: App-specific password incorreto!"
              puts "Vá em https://appleid.apple.com → App-Specific Passwords"
              puts "Crie um NOVO para miguelima926@gmail.com e atualize o secret APPLE_PASSWORD"
              exit 1
            }
            "Saving Apple ID password to the local Keychain" {
              # Login OK, continua
              expect "Team:"
              send "\r"
              expect "Distribution:"
              send "internal\r"
              expect eof
            }
            timeout {
              puts "\n❌ TIMEOUT: EAS não respondeu como esperado"
              exit 1
            }
          }
          EXPECT_EOF

          # Run with env vars
          APPLE_ID="${{ secrets.APPLE_ID }}" APPLE_PASSWORD="${{ secrets.APPLE_PASSWORD }}" expect /tmp/setup_credentials.exp
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}

      - name: Verify credentials saved
        run: |
          eas credentials:list --platform ios --profile development
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}